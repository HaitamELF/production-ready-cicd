apiVersion: apps/v1
kind: Deployment
metadata:
  name: production-ready-cicd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: production-ready-cicd
  template:
    metadata:
      labels:
        app: production-ready-cicd
    spec:
      containers:
        - name: app
          image: ghcr.io/haitamelf/production-ready-cicd:latest
          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10