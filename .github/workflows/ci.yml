name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff linting
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  dependency-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install security tooling
        run: |
          python -m pip install -r requirements-tooling.txt

      - name: Audit Python dependencies
        run: |
          pip-audit \
            --requirement requirements.txt \
            --progress-spinner off

  container:
    name: Container Build
    runs-on: ubuntu-latest
    needs:
      - quality
      - tests
      - dependency-audit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build \
            --tag production-ready-cicd:${{ github.sha }} \
            .

      - name: Inspect Docker image
        run: |
          docker image inspect production-ready-cicd:${{ github.sha }}

      - name: Save Docker image
        run: |
          docker save \
            production-ready-cicd:${{ github.sha }} \
            --output production-ready-cicd.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-ready-cicd-image
          path: production-ready-cicd.tar
          retention-days: 1


  security:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs:
      - container

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v5
        with:
          name: production-ready-cicd-image

      - name: Load Docker image
        run: |
          docker load \
            --input production-ready-cicd.tar

      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: production-ready-cicd:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"


  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs:
      - container

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v5
        with:
          name: production-ready-cicd-image

      - name: Load Docker image
        run: |
          docker load \
            --input production-ready-cicd.tar

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: production-ready-cicd:${{ github.sha }}
          format: cyclonedx
          output: sbom.cdx.json
          scan-type: image

      - name: Validate SBOM
        run: |
          test -s sbom.cdx.json
          jq -e '.bomFormat == "CycloneDX"' sbom.cdx.json

          echo "Components:"
          jq '.components | length' sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: sbom.cdx.json
          retention-days: 7